<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能出题器</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0b1220; color: #e6edf3; font-family: -apple-system, "PingFang SC", sans-serif; }
        .wrap { max-width: 820px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 1.3rem; margin-bottom: 12px; }
        .card { background: #111827; border: 1px solid #1f2a3a; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
        label { display: block; margin: 8px 0 4px; font-size: .9rem; color: #9ca3af; }
        textarea { width: 100%; min-height: 200px; padding: 10px; border-radius: 8px; border: 1px solid #2a3548; background: #0b1220; color: #e6edf3; font-size: .9rem; font-family: monospace; resize: vertical; }
        .hint { font-size: .8rem; color: #6b7280; margin-top: 4px; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
        .row > div { flex: 1; min-width: 140px; }
        select, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2a3548; background: #0b1220; color: #e6edf3; }
        button { padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; margin-right: 10px; margin-top: 12px; }
        .primary { background: #2563eb; color: #fff; }
        .ghost { background: #1f2937; color: #e5e7eb; border: 1px solid #374151; }
        .q-item { background: #111827; border: 1px solid #1f2a3a; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        .opts label { display: block; padding: 8px 12px; border-radius: 8px; margin: 4px 0; cursor: pointer; }
        .opts label:hover { background: #1f2937; }
        .opts input { margin-right: 10px; }
        .ans-area { margin-top: 10px; padding: 10px; background: #0b1220; border-radius: 8px; display: none; }
        .ans-area.show { display: block; }
        .right { color: #34d399; font-weight: bold; }
        .wrong { color: #f87171; font-weight: bold; }
        .score-bar { position: sticky; top: 0; background: #0b1220; padding: 15px 0; border-bottom: 1px solid #1f2a3a; margin-bottom: 15px; display: flex; gap: 10px; z-index: 10; }
        .score-box { text-align: center; padding: 10px; border-radius: 10px; background: #111827; border: 1px solid #1f2a3a; flex: 1; }
        .score-num { font-size: 1.4rem; color: #fbbf24; font-weight: bold; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>智能出题器</h1>
    <div class="card">
        <label>粘贴题目（每行一题）</label>
        <textarea id="rawInput" placeholder="格式示例：
13. 计算机的指令是一组二进制代码。（） 答案：Y
14. 通常把运算器、控制器合称为计算机系统。（） 答案：N"></textarea>
        <div class="hint">判断题用（），答案写 Y 或 N；选择题用 A/B/C/D 作答</div>
        <div class="row">
            <div>
                <label>抽取题量</label>
                <input type="number" id="countInput" value="3" min="1">
            </div>
        </div>
        <button class="primary" onclick="generate()">生成试卷</button>
        <button class="ghost" onclick="resetAll()">清空</button>
    </div>
    <div id="paperArea"></div>
</div>
<script>
let paper = [];

function parseLine(line) {
    line = line.trim();
    if (!line) return null;
    let answer = '';
    const am = line.match(/答案[：:]\s*([YNABCD])/i);
    if (am) { answer = am[1].toUpperCase(); line = line.replace(/答案[：:]\s*[YNABCD]/i, '').trim(); }
    let options = [];
    const om = line.match(/\(([YNABCD])\)/gi);
    if (om && !am) {
        options = om.map(o => o.replace(/[()]/g, ''));
        line = line.replace(/\([YNABCD]\)/gi, '（）');
    }
    return { question: line, options: options, answer: answer, score: 5 };
}

function generate() {
    const text = document.getElementById('rawInput').value;
    const lines = text.split('\n').filter(l => l.trim());
    const questions = lines.map(parseLine).filter(q => q);
    if (!questions.length) return alert('没有识别到题目，请检查格式');
    const count = parseInt(document.getElementById('countInput').value) || 3;
    questions.sort(() => Math.random() - 0.5);
    paper = questions.slice(0, count);
    render();
}

function render() {
    let html = '<div class="card"><button class="ghost" onclick="submit()">提交评分</button></div>';
    paper.forEach((q, i) => {
        html += `<div class="q-item"><b>第${i+1}题</b>（${q.score}分）<br>${q.question}<br><div class="opts">`;
        if (q.options.length > 0) {
            q.options.forEach(o => { html += `<label><input type="radio" name="q${i}" value="${o}"> ${o}</label>`; });
        } else {
            html += `<label><input type="radio" name="q${i}" value="Y"> Y</label><label><input type="radio" name="q${i}" value="N"> N</label>`;
        }
        html += `</div><div class="ans-area" id="ans${i}"></div></div>`;
    });
    document.getElementById('paperArea').innerHTML = html;
    document.getElementById('paperArea').scrollIntoView({ behavior: 'smooth' });
}

function submit() {
    let total = 0, got = 0;
    paper.forEach((q, i) => {
        total += q.score;
        const val = document.querySelector(`input[name="q${i}"]:checked`)?.value || '';
        const ok = val === q.answer;
        if (ok) got += q.score;
        const el = document.getElementById(`ans${i}`);
        el.classList.add('show');
        el.innerHTML = `${ok ? '<span class="right">✓ 正确</span>' : '<span class="wrong">✗ 错误</span>'} 答案：${q.answer}`;
    });
    const pct = total ? Math.round(got/total*100) : 0;
    const bar = `<div class="score-bar">
        <div class="score-box"><div class="score-num">${got}</div>得分</div>
        <div class="score-box"><div class="score-num">${total}</div>总分</div>
        <div class="score-box"><div class="score-num">${pct}%</div>正确率</div>
    </div>`;
    document.querySelector('.wrap').insertAdjacentHTML('afterbegin', bar);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetAll() {
    document.getElementById('rawInput').value = '';
    document.getElementById('paperArea').innerHTML = '';
    paper = [];
}
</script>
</body>
</html>
