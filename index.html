<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题库练习系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: #333; margin: 20px 0; }
        .exam-list { display: grid; gap: 15px; margin-top: 30px; }
        .exam-btn { padding: 20px; background: #fff; border: none; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; text-align: left;
            font-size: 18px; transition: all 0.3s; }
        .exam-btn:hover { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .exam-btn .count { color: #999; font-size: 14px; margin-top: 5px; }
        .hidden { display: none !important; }
        .question-card { background: #fff; border-radius: 10px; padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-top: 20px; }
        .question-text { font-size: 17px; line-height: 1.8; margin-bottom: 20px; color: #333; white-space: pre-wrap;}
        .options label { display: block; padding: 12px 15px; margin: 8px 0; background: #f8f9fa;
            border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .options label:hover { background: #e9ecef; }
        .options input { margin-right: 10px; }
        .fill-input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd;
            border-radius: 8px; font-size: 16px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .btn-primary { background: #4a90d9; color: #fff; }
        .btn-primary:hover { background: #3a7bc8; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #d0d0d0; }
        .progress { text-align: center; color: #666; margin: 15px 0; }
        .result { text-align: center; padding: 40px; }
        .result h2 { color: #4a90d9; margin-bottom: 20px; }
        .result .score { font-size: 60px; font-weight: bold; color: #4a90d9; }
        .result .detail { margin: 20px 0; color: #666; line-height: 2; text-align: left; }
        .back-btn { margin-top: 20px; }
        .answer-reveal { margin-top: 15px; padding: 15px; background: #f6ffed;
            border-radius: 8px; border-left: 4px solid #52c41a; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 首页 -->
        <div id="home">
            <h1>📚 题库练习系统</h1>
            <div class="exam-list" id="examList"></div>
        </div>

        <!-- 答题页 -->
        <div id="quiz" class="hidden">
            <div class="progress" id="progress"></div>
            <div class="question-card">
                <div class="question-text" id="questionText"></div>
                <div id="inputArea"></div>
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="prevQuestion()">上一题</button>
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">下一题</button>
                </div>
            </div>
            <button class="btn btn-secondary back-btn" onclick="backHome()">返回首页</button>
        </div>

        <!-- 结果页 -->
        <div id="result" class="hidden">
            <div class="question-card result">
                <h2>🎉 答题完成！</h2>
                <div class="score" id="scoreText"></div>
                <div class="detail" id="detailText"></div>
                <button class="btn btn-primary" onclick="backHome()">返回首页</button>
            </div>
        </div>
    </div>

    <script>
    // 引入外部题库数据文件
    // 请确保 data.js 和 index.html 在同一个文件夹下
    </script>
    <script src="data.js"></script>
    <script>
    // ===================== 核心逻辑 =====================
    let currentExamKey = null;
    let currentQuestions = [];
    let currentIndex = 0;
    let userAnswers = [];

    // 初始化首页
    function initHome() {
        const examList = document.getElementById('examList');
        examList.innerHTML = '';
        
        // 检查 EXAMS 变量是否已加载
        if (typeof EXAMS === 'undefined') {
            examList.innerHTML = '<p style="text-align:center; color:red;">题库数据未加载，请检查 data.js 是否配置正确！</p>';
            return;
        }

        Object.keys(EXAMS).forEach(key => {
            const exam = EXAMS[key];
            const total = (exam.CHOICES?.length || 0) + (exam.FILLS?.length || 0) + (exam.JUDGES?.length || 0);
            const btn = document.createElement('button');
            btn.className = 'exam-btn';
            btn.innerHTML = `${exam.name}<div class="count">共 ${total} 题</div>`;
            btn.onclick = () => startExam(key);
            examList.appendChild(btn);
        });
    }

    // 开始考试
    function startExam(key) {
        currentExamKey = key;
        const exam = EXAMS[key];
        currentQuestions = [];
        
        // 合并题目并打乱顺序
        if (exam.CHOICES) currentQuestions.push(...exam.CHOICES.map(q => ({...q, type: 'choice'})));
        if (exam.FILLS) currentQuestions.push(...exam.FILLS.map(q => ({...q, type: 'fill'})));
        if (exam.JUDGES) currentQuestions.push(...exam.JUDGES.map(q => ({...q, type: 'judge'})));
        
        currentQuestions.sort(() => Math.random() - 0.5);
        
        currentIndex = 0;
        userAnswers = new Array(currentQuestions.length).fill(null);
        
        document.getElementById('home').classList.add('hidden');
        document.getElementById('result').classList.add('hidden');
        document.getElementById('quiz').classList.remove('hidden');
        
        renderQuestion();
    }

    // 渲染题目
    function renderQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById('progress').textContent = `第 ${currentIndex + 1} / ${currentQuestions.length} 题`;
        document.getElementById('questionText').textContent = q.question;
        
        const inputArea = document.getElementById('inputArea');
        inputArea.innerHTML = '';
        
        if (q.type === 'choice' || q.type === 'judge') {
            const options = q.type === 'judge' ? ['正确', '错误'] : q.options;
            const answers = q.type === 'judge' ? ['Y', 'N'] : q.options.map((_, i) => String.fromCharCode(65 + i));
            
            options.forEach((opt, i) => {
                const label = document.createElement('label');
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = 'answer';
                input.value = answers[i];
                if (userAnswers[currentIndex] === answers[i]) input.checked = true;
                input.onchange = (e) => userAnswers[currentIndex] = e.target.value;
                
                label.appendChild(input);
                label.appendChild(document.createTextNode(q.type === 'judge' ? opt : opt));
                inputArea.appendChild(label);
            });
        } else if (q.type === 'fill') {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'fill-input';
            input.placeholder = '请输入答案...';
            input.value = userAnswers[currentIndex] || '';
            input.oninput = (e) => userAnswers[currentIndex] = e.target.value;
            inputArea.appendChild(input);
        }
        
        document.getElementById('nextBtn').textContent = currentIndex === currentQuestions.length - 1 ? '提交' : '下一题';
    }

    // 下一题
    function nextQuestion() {
        if (currentIndex < currentQuestions.length - 1) {
            currentIndex++;
            renderQuestion();
        } else {
            showResult();
        }
    }

    // 上一题
    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    // 显示结果
    function showResult() {
        let correct = 0;
        let detail = '';
        
        currentQuestions.forEach((q, i) => {
            const userAns = userAnswers[i];
            const correctAns = q.answer;
            let isCorrect = false;
            
            if (q.type === 'fill') {
                // 填空题模糊匹配
                const ansArr = Array.isArray(correctAns) ? correctAns : [correctAns];
                isCorrect = ansArr.some(a => userAns && userAns.trim().toLowerCase() === a.toLowerCase());
            } else {
                isCorrect = userAns === correctAns;
            }
            
            if (isCorrect) correct++;
            
            detail += `<div style="margin-bottom:15px; border-bottom:1px dashed #ccc; padding-bottom:10px;">
                <strong>${i+1}. ${q.question}</strong><br>
                你的答案：<span style="color:${isCorrect ? 'green' : 'red'}">${userAns || '未作答'}</span><br>
                正确答案：<span style="color:green">${Array.isArray(correctAns) ? correctAns.join('/') : correctAns}</span>
            </div>`;
        });
        
        const score = Math.round((correct / currentQuestions.length) * 100);
        document.getElementById('scoreText').textContent = `${score} 分`;
        document.getElementById('detailText').innerHTML = detail;
        
        document.getElementById('quiz').classList.add('hidden');
        document.getElementById('result').classList.remove('hidden');
    }

    // 返回首页
    function backHome() {
        document.getElementById('quiz').classList.add('hidden');
        document.getElementById('result').classList.add('hidden');
        document.getElementById('home').classList.remove('hidden');
        initHome();
    }

    // 页面加载完成初始化
    window.onload = initHome;
    </script>
</body>
</html>
