<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地智能出题器</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0b1220; color: #e6edf3; font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; }
        .wrap { max-width: 820px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 1.3rem; margin-bottom: 12px; }
        .card { background: #111827; border: 1px solid #1f2a3a; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
        label { display: block; margin: 8px 0 4px; font-size: .9rem; color: #9ca3af; }
        select, input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2a3548; background: #0b1220; color: #e6edf3; font-size: .95rem; }
        textarea { min-height: 100px; resize: vertical; font-family: monospace; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .row > div { flex: 1; min-width: 140px; }
        button { padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; margin-right: 10px; }
        .primary { background: #2563eb; color: #fff; }
        .primary:hover { background: #1d4ed8; }
        .ghost { background: #1f2937; color: #e5e7eb; border: 1px solid #374151; }
        .ghost:hover { background: #374151; }
        .hint { font-size: .82rem; color: #9ca3af; margin-top: 4px; }
        .paper { background: #0f172a; border: 1px solid #1f2a3a; border-radius: 12px; padding: 18px; }
        .paper-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
        .tag { display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: .75rem; background: #1e293b; color: #93c5fd; margin-right: 6px; }
        .q-item { background: #111827; border: 1px solid #1f2a3a; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        .q-head { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: .9rem; }
        .q-score { color: #fbbf24; }
        .opts label { display: block; padding: 8px 12px; border-radius: 8px; margin: 4px 0; cursor: pointer; border: 1px solid transparent; }
        .opts label:hover { background: #1f2937; }
        .opts input { margin-right: 10px; }
        .ans-area { margin-top: 10px; padding: 10px; background: #0b1220; border-radius: 8px; display: none; font-size: .9rem; }
        .ans-area.show { display: block; }
        .right { color: #34d399; font-weight: bold; }
        .wrong { color: #f87171; font-weight: bold; }
        .score-bar { position: sticky; top: 0; background: #0b1220; padding: 15px 0; display: flex; gap: 10px; border-bottom: 1px solid #1f2a3a; margin-bottom: 15px; z-index: 10; }
        .score-box { text-align: center; padding: 10px; border-radius: 10px; background: #111827; border: 1px solid #1f2a3a; flex: 1; }
        .score-num { font-size: 1.4rem; color: #fbbf24; font-weight: bold; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>本地智能出题器 (无AI)</h1>
    
    <div class="card">
        <label>1. 录入题库 (JSON格式)</label>
        <textarea id="db">
[
  {"subject": "数学", "question": "1 + 1 = ?", "options": ["1", "2", "3", "4"], "answer": "2", "score": 5},
  {"subject": "计算机", "question": "1MB = ? KB", "options": ["100", "1024", "1000", "2048"], "answer": "1024", "score": 5},
  {"subject": "语文", "question": "“床前明月光”的作者是谁？", "options": ["杜甫", "李白", "白居易", "苏轼"], "answer": "李白", "score": 5},
  {"subject": "英语", "question": "Which is the correct spelling?", "options": ["Appl", "Apple", "Apel", "Aple"], "answer": "Apple", "score": 5},
  {"subject": "历史", "question": "秦始皇统一六国是在哪一年？", "options": ["公元前221年", "公元前121年", "公元221年", "公元206年"], "answer": "公元前221年", "score": 5}
]
        </textarea>
        <div class="hint">在这里粘贴你的题目数据，格式：[{"subject": "科目", "question": "题目", "options": ["A","B","C","D"], "answer": "正确答案", "score": 分值}]</div>

        <div class="row" style="margin-top:12px">
            <div>
                <label>2. 选择学科</label>
                <select id="subjectSelect"><option value="全部">全部学科</option></select>
            </div>
            <div>
                <label>3. 抽取题量</label>
                <input type="number" id="countInput" value="3" min="1">
            </div>
        </div>

        <button class="primary" onclick="generatePaper()">生成试卷</button>
        <button class="ghost" onclick="resetView()">清空</button>
    </div>

    <div id="paperArea"></div>
</div>

<script>
// 初始化下拉菜单
const dbBox = document.getElementById("db");
const subSelect = document.getElementById("subjectSelect");

function updateSubjects() {
    let subjects = new Set();
    try {
        const data = JSON.parse(dbBox.value);
        data.forEach(q => subjects.add(q.subject));
    } catch(e){}
    subSelect.innerHTML = '<option value="全部">全部学科</option>';
    subjects.forEach(s => {
        if(s) subSelect.innerHTML += `<option value="${s}">${s}</option>`;
    });
}
dbBox.addEventListener("input", updateSubjects);
updateSubjects();

let currentPaper = [];

function generatePaper() {
    let data = [];
    try {
        data = JSON.parse(dbBox.value);
    } catch (e) {
        return alert("题库 JSON 格式有误，请检查！");
    }

    const targetSub = document.getElementById("subjectSelect").value;
    let count = parseInt(document.getElementById("countInput").value) || 5;

    // 筛选学科
    let pool = targetSub === "全部" ? data : data.filter(q => q.subject === targetSub);
    
    if(pool.length === 0) return alert("该学科下没有题目！");

    // 随机抽取
    pool.sort(() => Math.random() - 0.5);
    currentPaper = pool.slice(0, count);

    renderPaper(currentPaper, targetSub);
}

function renderPaper(questions, subjectLabel) {
    const area = document.getElementById("paperArea");
    let html = `<div class="paper">
        <div class="paper-head">
            <div>
                <span class="tag">${subjectLabel}</span>
                <span class="tag">${questions.length} 题</span>
            </div>
            <button class="ghost" onclick="submitPaper()">提交并评分</button>
        </div>`;

    questions.forEach((q, i) => {
        html += `<div class="q-item">
            <div class="q-head">
                <b>第 ${i+1} 题</b>
                <span class="q-score">${q.score || 5}分</span>
            </div>
            <div style="margin-bottom:8px">${q.question}</div>
            <div class="opts">`;
        
        if(Array.isArray(q.options)) {
            q.options.forEach((opt, idx) => {
                html += `<label><input type="radio" name="q${i}" value="${opt}"> ${opt}</label>`;
            });
        } else {
            html += `<input type="text" placeholder="输入答案" name="q${i}" value="">`;
        }

        html += `</div>
            <div class="ans-area" id="ans${i}">
                <div>正确答案：<b>${q.answer}</b></div>
            </div>
        </div>`;
    });

    html += `</div>`;
    area.innerHTML = html;
    area.scrollIntoView({ behavior: 'smooth' });
}

function submitPaper() {
    if(currentPaper.length === 0) return alert("请先生成试卷");
    
    let total = 0, got = 0;
    currentPaper.forEach((q, i) => {
        const s = q.score || 5;
        total += s;
        const userVal = document.querySelector(`input[name="q${i}"]:checked`)?.value || document.querySelector(`input[name="q${i}"]`)?.value || "";
        
        const isRight = String(userVal).trim() === String(q.answer).trim();
        if(isRight) got += s;

        const ansEl = document.getElementById(`ans${i}`);
        ansEl.classList.add("show");
        const mark = isRight ? '<span class="right">✓ 正确</span>' : '<span class="wrong">✗ 错误</span>';
        ansEl.innerHTML = `<div style="margin-bottom:5px">${mark}</div>` + ansEl.innerHTML;
    });

    let bar = `<div class="score-bar">
        <div class="score-box"><div class="score-num">${got}</div><div>得分</div></div>
        <div class="score-box"><div class="score-num">${total}</div><div>总分</div></div>
        <div class="score-box"><div class="score-num">${total ? Math.round(got/total*100) : 0}%</div><div>正确率</div></div>
    </div>`;
    
    let p = document.querySelector(".paper");
    if(p) p.insertAdjacentHTML('afterbegin', bar);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetView() {
    document.getElementById("paperArea").innerHTML = "";
    currentPaper = [];
}
</script>
</body>
</html>
