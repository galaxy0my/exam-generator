<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闯关答题器</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b1220; color: #e6edf3; font-family: -apple-system, "PingFang SC", sans-serif; display: flex; justify-content: center; min-height: 100vh; }
    .wrap { max-width: 650px; width: 100%; padding: 20px; margin-top: 40px; }
    .card { background: #111827; border: 1px solid #1f2a3a; border-radius: 12px; padding: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 16px; text-align: center; }
    label { display: block; margin-bottom: 8px; font-size: .9rem; color: #9ca3af; }
    textarea { width: 100%; min-height: 250px; padding: 12px; border-radius: 8px; border: 1px solid #2a3548; background: #0b1220; color: #e6edf3; font-size: .85rem; resize: vertical; outline: none; }
    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 1rem; }
    .primary { background: #2563eb; color: #fff; }
    .primary:hover { background: #1d4ed8; }
    .game-area { display: none; background: #111827; border: 1px solid #1f2a3a; border-radius: 12px; padding: 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header .info { color: #9ca3af; font-size: .9rem; }
    .q-content { font-size: 1.1rem; line-height: 1.6; margin-bottom: 24px; font-weight: 600; }
    .opts { display: flex; flex-direction: column; gap: 10px; }
    .opt-btn { background: #1e293b; border: 1px solid #334155; padding: 14px 16px; border-radius: 8px; text-align: left; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; font-size: 1rem; }
    .opt-btn:hover { background: #2563eb; border-color: #3b82f6; }
    .opt-btn.correct { background: #064e3b; border-color: #10b981; }
    .opt-btn.wrong { background: #7f1d1d; border-color: #ef4444; }
    .judge-btns { display: flex; gap: 16px; }
    .judge-btns .opt-btn { flex: 1; text-align: center; justify-content: center; }
    .hint-text { margin-top: 16px; color: #fbbf24; font-size: .95rem; display: none; }
</style>
</head>
<body>
<div class="wrap">
    <div class="card" id="startScreen">
        <h1>🎯 闯关答题器</h1>
        <label>粘贴你的题库</label>
        <textarea id="inputText" placeholder="直接把题库粘进来即可。"></textarea>
        <div class="btn-row">
            <button class="primary" onclick="startGame()">开始闯关</button>
        </div>
    </div>

    <div class="game-area" id="gameScreen">
        <div class="header">
            <div class="info" id="progressText">第 1 / 10 题</div>
            <div class="info" id="scoreText">得分：0</div>
        </div>
        <div class="q-content" id="questionText"></div>
        <div class="opts" id="optionsContainer"></div>
        <div class="hint-text" id="hintText">❌ 答错了，请重新选择正确答案</div>
    </div>
</div>

<script>
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let isAnswered = false;

    function parseQuestions(text) {
        let qList = [];
        const regex = /(\d+)[\.、]\s*(.*?答案[：:]?[（(]\s*([A-N]?)\s*[）)])/gis;
        let match;
        while ((match = regex.exec(text)) !== null) {
            let fullContent = match[2].trim();
            let answer = match[3].toUpperCase();
            let options = [];
            let optRegex = /([A-D][\.、]?)\s*([^A-D\.]+)/g;
            let optMatch;
            let contentWithoutOpts = fullContent;
            while ((optMatch = optRegex.exec(fullContent)) !== null) {
                options.push({ key: optMatch[1], text: optMatch[2].trim() });
                contentWithoutOpts = contentWithoutOpts.replace(optMatch[0], '');
            }
            let type = 'choice';
            if(['Y', 'N', '正确', '错误'].includes(answer)) {
                type = 'judge';
            }
            qList.push({
                question: contentWithoutOpts.replace(/答案[：:]（([）)]/, '').trim(),
                options: options,
                answer: answer,
                type: type
            });
        }
        return qList;
    }

    function startGame() {
        const text = document.getElementById('inputText').value;
        questions = parseQuestions(text);
        if(questions.length === 0) {
            alert("没识别到题目！请检查题库格式。");
            return;
        }
        questions.sort(() => Math.random() - 0.5);
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';
        currentIndex = 0;
        score = 0;
        showQuestion();
    }

    function showQuestion() {
        isAnswered = false;
        const q = questions[currentIndex];
        document.getElementById('progressText').innerText = `第 ${currentIndex + 1} / ${questions.length} 题`;
        document.getElementById('scoreText').innerText = `得分：${score}`;
        document.getElementById('hintText').style.display = 'none';
        document.getElementById('questionText').innerText = q.question;
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        container.className = 'opts';
        if(q.type === 'judge') {
            container.classList.add('judge-btns');
            container.innerHTML = `
                <div class="opt-btn" onclick="checkAnswer(this, 'Y')">✅ 正确 (Y)</div>
                <div class="opt-btn" onclick="checkAnswer(this, 'N')">❌ 错误 (N)</div>
            `;
        } else {
            q.options.forEach((opt) => {
                const div = document.createElement('div');
                div.className = 'opt-btn';
                div.innerText = `${opt.key}. ${opt.text}`;
                div.onclick = function() { checkAnswer(this, opt.key); };
                container.appendChild(div);
            });
        }
    }

    function checkAnswer(btn, userAnswer) {
        if(isAnswered) return;
        const q = questions[currentIndex];
        const correct = q.answer.toUpperCase() === userAnswer.toUpperCase();

        if(correct) {
            isAnswered = true;
            btn.classList.add('correct');
            score += 10;
            document.getElementById('scoreText').innerText = `得分：${score}`;
            // 答对后自动进入下一题
            setTimeout(() => {
                currentIndex++;
                if(currentIndex >= questions.length) {
                    alert(`🎉 闯关完成！最终得分：${score}`);
                    location.reload();
                } else {
                    showQuestion();
                }
            }, 600);
        } else {
            // 答错：标红，提示重新选，不进入下一题
            btn.classList.add('wrong');
            document.getElementById('hintText').style.display = 'block';
        }
    }
</script>
</body>
</html>
